name: Prepare Install-from-Git release

# Cribl's "Install from Git" reads a pre-built package (static/index.html +
# package.json + default/proxies.yml) from a tagged commit, not this repo's
# source tree directly. This workflow runs scripts/prepare-git-pack.mjs
# whenever package.json changes on main, and pushes the resulting `release`
# branch + `v<version>` tag so Install from Git has something to find.
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch existing release branch (if any)
        run: git fetch origin release:release || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: node scripts/prepare-git-pack.mjs

      - name: Push release branch and tag
        run: |
          git push origin release
          git push origin --tags --force
