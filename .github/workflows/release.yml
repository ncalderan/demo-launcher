name: Prepare Install-from-Git release

# Cribl's Admin Guide is explicit: "Add App > Import from Git can install
# from a repository that contains a valid App package layout" — it clones
# the given ref's TREE directly (confirmed live: pointing it at a tag whose
# commit has no static/index.html in the tree fails with that exact error,
# regardless of any GitHub Release or attached .tgz asset at that tag).
#
# This repo's main branch deliberately keeps dist/static out of git (see
# .gitignore), so this workflow runs scripts/prepare-git-pack.mjs whenever
# package.json changes on main, and pushes the resulting `release` branch +
# `v<version>` tag — a commit whose tree directly contains static/index.html
# + package.json + default/proxies.yml — so Import from Git has something to
# clone and find.
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch existing release branch (if any)
        run: git fetch origin release:release || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: node scripts/prepare-git-pack.mjs

      - name: Push release branch and tag
        run: |
          git push origin release
          git push origin --tags --force
