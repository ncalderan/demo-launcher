name: Release

# Cribl's "Import from Git" installs a GitHub Release's attached .tgz asset,
# not raw files from the repo tree — confirmed against Cribl's own internal
# "App Publishing to Github" guide. This workflow triggers on any pushed tag
# matching v*, packages the app at that version (npm run package already
# builds the exact static/index.html + package.json + default/proxies.yml
# layout Import from Git expects, just zipped into a .tgz), and publishes it
# as a GitHub Release with the .tgz attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run lint

      - name: Package at the tag's version (leading v stripped)
        run: npm run package -- --version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release with the .tgz attached
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
